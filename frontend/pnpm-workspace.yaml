# pnpm 11 moved build-approval settings out of package.json's "pnpm" field.
# sharp/unrs-resolver are transitive deps (Next.js/Tailwind) with postinstall
# scripts pnpm otherwise refuses to run non-interactively; approving them here
# avoids ERR_PNPM_IGNORED_BUILDS failing `pnpm install` in Docker/CI.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
allowBuilds:
  sharp: true
  unrs-resolver: true
