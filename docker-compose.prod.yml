# Hardened production stack (T9: BIO2 8.24, 5.18, 8.15). docker-compose.yml
# stays the development setup.
#
#   cp .env.prod.example .env.prod      # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from the dev compose file:
# - Only Caddy publishes ports (443/80) and terminates TLS. API, worker,
#   database and Redis are reachable only on the internal Docker network.
# - API and worker connect as `tolkcheck_app` (row read/write only), created by
#   deploy/postgres/10-app-role.sh. Schema migrations run once in `migrate`,
#   as the database owner, before the API starts.
# - No default passwords: every secret is required (${VAR:?}). Redis requires
#   a password. No Adminer.
# - Containers run as non-root users (backend/Dockerfile, frontend/Dockerfile).
#
# What this file cannot provide, and the deployment must (DEPLOYMENT-SECURITY.md):
# disk/volume encryption, MFA via the organisation's SSO, central log
# collection with retention, encrypted backups, per-IP rate limiting.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://tolkcheck_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/tolkcheck
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (openssl rand -hex 32)}
  COOKIE_SECURE: "true"
  CORS_ORIGINS: '["https://${DOMAIN:?set DOMAIN}"]'
  HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  RETENTION_DAYS: ${RETENTION_DAYS:-90}
  LOG_LEVEL: INFO

services:

  caddy:
    image: caddy:2
    ports:
      - "443:443"
      - "80:80"           # only to redirect to https and for ACME challenges
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/tolkcheck
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (openssl rand -hex 32)}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    volumes:
      - uploads_data:/app/uploads
      - models:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *backend-env
    volumes:
      - uploads_data:/app/uploads
      - models:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Holds only the job queue (session ids, no audio or transcripts).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tolkcheck
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d tolkcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  models:
  caddy_data:
  caddy_config:
