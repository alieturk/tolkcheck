services:

  # ── Next.js frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ── FastAPI backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv   # keep the Linux venv built in the image
      - uploads_data:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/tolkcheck
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── ARQ worker ────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: uv run arq app.worker.WorkerSettings
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv   # same Linux venv as backend
      - uploads_data:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/tolkcheck
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Redis (ARQ task queue) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ── Adminer — web UI for the database (http://localhost:8080) ────────────
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    # pgvector/pgvector:pg16 = postgres:16-bookworm (Debian/glibc — pgvector
    # ships no -alpine build) plus the pgvector extension compiled in. Needed
    # for the knowledge_chunks table backing RAG feedback retrieval (see
    # backend/app/models/knowledge.py, alembic revision d7f4b2c91a3e).
    #
    # NOT a drop-in swap on top of the existing postgres_data volume: the
    # previous image (postgres:16-alpine) is musl/Alpine, this one is
    # glibc/Debian. Postgres text indexes (e.g. ix_users_email) are built
    # against the OS collation library, and musl vs glibc do not sort text
    # identically — reusing the old data directory under the new image risks
    # silently corrupt indexes, not just a compatibility error. Since this is
    # local/dev data (synthetic Turkish–Dutch test sessions, see project
    # scope notes), the simple safe path is to drop the old volume and let
    # migrations recreate the schema from scratch:
    #   docker compose down
    #   docker volume rm tolkcheck_postgres_data   # confirm the real volume name via `docker volume ls`
    #   docker compose up -d db
    #   (inside backend) uv run alembic upgrade head
    # If real accounts/sessions must be preserved, pg_dump/pg_restore across
    # the swap instead of reusing the volume directly.
    image: pgvector/pgvector:pg16
    ports:
      # Host-side port only — internal services reach this via the Docker
      # network hostname "db:5432" regardless of what's published here.
      # Remapped off 5432 because Windows/Hyper-V's WinNAT reserves that
      # port on this machine (bind fails with a permissions error); if you
      # fix that at the OS level, feel free to change this back to 5432:5432.
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tolkcheck
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  backend_venv:    # Linux venv built during `docker build`; shared by backend + worker
